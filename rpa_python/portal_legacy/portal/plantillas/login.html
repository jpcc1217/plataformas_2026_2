{% extends "base.html" %}
{% block titulo %}Ingreso{% endblock %}
{% block contenido %}
<h1>Ingreso al sistema</h1>
{% if ui == "v1" %}
{% if error %}<p class="mensaje-error" role="alert">{{ error }}</p>{% endif %}
<form id="frmLogin" method="post" action="/login">
<table class="formulario">
<tr><td><label for="txtUsr">Usuario</label></td><td><input id="txtUsr" name="usuario" type="text"></td></tr>
<tr><td><label for="txtPwd">Contraseña</label></td><td><input id="txtPwd" name="clave" type="password"></td></tr>
<tr><td></td><td><button id="btnLogin" type="submit">Ingresar</button></td></tr>
</table>
</form>
{% else %}
{% if error %}<div class="aviso-error" role="alert">{{ error }}</div>{% endif %}
<form class="acceso" method="post" action="/login">
<div class="campo"><label for="usuario-acceso">Usuario</label><input id="usuario-acceso" name="usuario" autocomplete="username"></div>
<div class="campo"><label for="clave-acceso">Contraseña</label><input id="clave-acceso" name="clave" type="password" autocomplete="current-password"></div>
<button class="boton-primario" type="submit">Ingresar</button>
</form>
{% endif %}
{% endblock %}
