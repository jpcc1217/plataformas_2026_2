  #     ddl-auto: update
  #   show-sql: true

application:
  security:
    jwt:
      secret-key: MI_SECRETO_HIPER_LARGO_PARA_JWT_DE_256_BITS_FARMACIA_SUPER_SEGURO
      expiration: 86400000 # 24 horas en milisegundos

server:
  port: 6002